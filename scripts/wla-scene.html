<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>WLA laptop scene</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #222; }

  /* Fixed-size scene at the viewport origin so it can be cropped exactly */
  .scene {
    position: absolute;
    top: 0;
    left: 0;
    width: 1120px;
    height: 700px;
    overflow: hidden;
    perspective: 1900px;
    perspective-origin: 50% 32%;
  }

  /* Warm plaster wall with a soft light pool behind the laptop */
  .wall {
    position: absolute;
    inset: 0 0 38% 0;
    background:
      radial-gradient(60% 80% at 50% 55%, rgba(255, 252, 244, 0.55), transparent 70%),
      linear-gradient(180deg, #eae4da 0%, #d8d1c4 100%);
  }

  /* Wooden desk surface */
  .desk {
    position: absolute;
    inset: 62% 0 0 0;
    background:
      linear-gradient(180deg, rgba(0, 0, 0, 0.18), transparent 14%),
      linear-gradient(180deg, #a97f52 0%, #8d6741 60%, #7a5837 100%);
  }
  .desk::before {
    /* subtle plank sheen */
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      92deg,
      rgba(255, 255, 255, 0.045) 0 3px,
      transparent 3px 90px
    );
  }

  /* Soft contact shadow under the laptop */
  .shadow {
    position: absolute;
    left: 50%;
    top: 520px;
    width: 660px;
    height: 120px;
    transform: translateX(-50%) skewX(-14deg);
    background:
      radial-gradient(45% 45% at 50% 50%, rgba(20, 12, 5, 0.75), transparent 75%),
      radial-gradient(50% 50% at 50% 50%, rgba(30, 18, 8, 0.5), transparent 70%);
    filter: blur(14px);
  }

  .laptop {
    position: absolute;
    left: 50%;
    top: 0;
    width: 0;
    height: 600px; /* hinge line sits at the bottom of this box */
    transform-style: preserve-3d;
    transform: translateX(35px) scale(0.72) rotateY(-17deg);
  }

  .lid {
    position: absolute;
    bottom: 0;
    left: -374px;
    width: 748px;
    height: 433px;
    transform-origin: 50% 100%;
    transform: rotateX(-7deg);
    background: linear-gradient(180deg, #3c3c40 0%, #232326 8%, #141416 100%);
    border-radius: 16px 16px 6px 6px;
    padding: 14px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }

  .screen {
    position: relative;
    width: 720px;
    height: 405px;
    overflow: hidden;
    border-radius: 6px;
    background: #000;
  }
  /* Map the page-content region of the raw 1920x1080 desktop screenshot
     (x 100-1597, y 176-1018 — no browser chrome or taskbar) onto the
     16:9 screen. Scale factor: 720 / 1497 = 0.4810. */
  .screen img {
    position: absolute;
    width: 923.5px;
    left: -48.1px;
    top: -84.7px;
  }

  .base {
    position: absolute;
    top: 100%;
    left: -390px;
    width: 780px;
    height: 330px; /* depth of the deck */
    transform-origin: 50% 0%;
    transform: rotateX(84deg);
    background: linear-gradient(180deg, #55555a 0%, #3f3f44 30%, #2c2c30 100%);
    border-radius: 8px 8px 22px 22px;
  }
  .keys {
    position: absolute;
    top: 26px;
    left: 60px;
    right: 60px;
    height: 150px;
    border-radius: 8px;
    background:
      repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.5) 0 22px, transparent 22px 26px),
      repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.5) 0 40px, transparent 40px 44px),
      #202024;
  }
  .touchpad {
    position: absolute;
    top: 196px;
    left: 50%;
    width: 220px;
    height: 130px;
    transform: translateX(-50%);
    border-radius: 10px;
    background: linear-gradient(180deg, #4a4a4f, #3a3a3f);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35);
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="wall"></div>
    <div class="desk"></div>
    <div class="shadow"></div>
    <div class="laptop">
      <div class="base">
        <div class="keys"></div>
        <div class="touchpad"></div>
      </div>
      <div class="lid">
        <div class="screen">
          <img src="/public/assets/wla-screenshot.png" alt="" />
        </div>
      </div>
    </div>
  </div>
</body>
</html>

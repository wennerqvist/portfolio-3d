name: Update Substack posts

on:
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest Substack posts
        run: node scripts/fetch-substack.js

      - name: Commit changes if the feed moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/data/substack-posts.json; then
            echo "No new posts."
            exit 0
          fi
          git add public/data/substack-posts.json
          git commit -m "Update Substack posts"
          git push

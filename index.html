<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio — 3D Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="webgl"></canvas>
  <div class="vignette"></div>
  <div class="scroll-space"></div>

  <header class="ui-header">
    <div class="logo">JW<span class="accent">.</span></div>
    <nav class="nav">
      <a href="#">Work</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <div class="ui-hero">
    <h1>Creative<br />Portfolio</h1>
    <p class="subtitle">Selected projects — 2026</p>
  </div>

  <footer class="ui-footer">
    <span class="hint">Drag or scroll to explore</span>
    <span class="counter"><span id="active-index">01</span> / <span id="project-total">06</span></span>
  </footer>

  <!-- Project details overlay (populated from projects.js on card click) -->
  <section class="details" id="details">
    <button class="details-back" id="details-back" type="button">&larr; Back</button>
    <div class="details-inner">
      <div class="details-media">
        <img id="details-image" alt="" />
      </div>
      <div class="details-content">
        <div class="details-meta">
          <span id="details-index">01</span>
          <span>2026</span>
        </div>
        <h2 id="details-title"></h2>
        <p id="details-description"></p>
        <div class="details-tags" id="details-tags"></div>
        <a class="details-link" id="details-link" target="_blank" rel="noopener">Visit project &#8599;</a>
      </div>
    </div>
  </section>

  <!-- GSAP + Lenis (UMD builds from CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>

  <!-- Three.js (ES module from CDN) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
